; Standalone php-fpm config for this image, loaded explicitly via `php-fpm -y`
; so it does not depend on the versioned config paths (/etc/php85/...) that
; change with every PHP bump in the base image.
[global]
error_log = /dev/stderr

[www]
; Enable status page
pm.status_path = /fpm-status

listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 50
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Make sure the FPM workers can reach the environment variables for configuration
clear_env = no

; Catch output from PHP
catch_workers_output = yes
