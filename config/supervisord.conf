[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
; The php-fpm binary is versioned (php-fpm85, php-fpm86, ...) and the base
; image has no versionless symlink, so locate whatever it ships. Config is
; ours (-y) to avoid the base image's versioned /etc/phpNN paths.
command=sh -c 'exec $(ls /usr/sbin/php-fpm* | head -n 1) -F -y /etc/php-fpm.conf'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
startretries=0

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
startretries=0
